{% extends 'base.html' %}
{% block title %}Verify Login - Greenline Mobile Store{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="bg-white rounded-4 shadow-lg border p-4 p-md-5" style="border-color: rgba(16, 185, 129, 0.25) !important;">

        <div class="text-center mb-4">
          <div class="gp-brand-icon mx-auto mb-3" style="width: 60px; height: 60px; font-size: 1.6rem;">
            <i class="fa-solid fa-shield-halved"></i>
          </div>
          <h3 class="fw-extrabold text-dark">Two-Factor Verification</h3>
          <p class="text-muted small">We've emailed a 6-digit code to your registered email address. Enter it below to finish signing in.</p>
        </div>

        <form method="POST">
          {% csrf_token %}
          <div class="mb-4">
            <label class="form-label small fw-bold">Verification Code</label>
            <input type="text" name="code" class="form-control green-input text-center fs-4 fw-bold" style="letter-spacing: 0.5rem;" maxlength="6" inputmode="numeric" pattern="[0-9]*" required autofocus>
          </div>
          <button type="submit" class="btn btn-emerald btn-lg w-100 rounded-pill shadow-sm">
            <i class="fa-solid fa-check me-2"></i> Verify & Sign In
          </button>
        </form>

      </div>
    </div>
  </div>
</div>
{% endblock %}
