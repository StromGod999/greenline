{% extends 'base.html' %}
{% block title %}Check Your Email - Greenline Mobile Store{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
      <div class="bg-white rounded-4 shadow-lg border p-4 p-md-5 text-center" style="border-color: rgba(16, 185, 129, 0.25) !important;">
        <div class="gp-brand-icon mx-auto mb-3" style="width: 60px; height: 60px; font-size: 1.6rem;">
          <i class="fa-solid fa-envelope-circle-check"></i>
        </div>
        <h3 class="fw-extrabold text-dark">Verify Your Email</h3>
        <p class="text-muted">
          We've sent a confirmation link to your email address. Click the link in that
          email to activate your account before signing in.
        </p>
        <a href="{% url 'account_login' %}" class="btn btn-emerald rounded-pill px-4 mt-2">
          <i class="fa-solid fa-arrow-right-to-bracket me-2"></i> Back to Sign In
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
